  },

  editModel() {
    const model = StorageManager.getSetting('openaiModel') || 'deepseek-chat';
    UI.modal(`
      <div class="modal__header">
        <div class="modal__title">选择模型</div>
        <div class="modal__close" onclick="UI.closeModal()">✕</div>
      </div>
      <div class="modal__body">
        <div class="form-group">
          <select class="form-input" id="set-model">
            <option value="deepseek-chat" ${model==='deepseek-chat'?'selected':''}>deepseek-chat（推荐，性价比最高）</option>
            <option value="deepseek-reasoner" ${model==='deepseek-reasoner'?'selected':''}>deepseek-reasoner（推理更强，稍贵）</option>
          </select>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="Settings.saveModel()">保存</button>
      </div>
    `);
  },

  saveModel() {
    StorageManager.setSetting('openaiModel', $('#set-model').value);
    UI.closeModal();
    UI.toast('已切换模型');
    this.render();
  },

  exportData() {
    const json = StorageManager.export();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `个人工作台_备份_${today()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    UI.toast('数据已导出');
  },

  importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          UI.confirm('导入将覆盖当前所有数据，确定继续？', '导入确认', () => {
            StorageManager.import(ev.target.result);
            UI.toast('数据已导入');
            this.render();
            Router.navigate('dashboard');
          });
        } catch (err) {
          UI.toast('导入失败：' + err.message);
        }
      };
      reader.readAsText(file);
    };
    input.click();
  },

  clearData() {
    UI.confirm('⚠️ 此操作将删除所有数据且不可恢复！\n建议先导出备份。\n\n确定要清除所有数据吗？', '清除数据', () => {
      localStorage.removeItem(StorageManager.KEY);
      StorageManager.init();
      UI.toast('数据已清除');
      this.render();
      Router.navigate('dashboard');
    });
  }
};

/* ==================== PWA 配置 ==================== */
function setupPWA() {
  // Manifest
  const manifest = {
    name: '个人工作台',
    short_name: '工作台',
    description: '记账·存钱·健身·自媒体管理',
    start_url: location.href,
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#FFFFFF',
    theme_color: '#4A90D9',
    icons: [{
      src: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#4A90D9"/><text x="96" y="110" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="bold" fill="white">台</text></svg>`),
      sizes: '192x192',
      type: 'image/svg+xml'
    }, {
      src: 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="108" fill="#4A90D9"/><text x="256" y="300" text-anchor="middle" font-family="sans-serif" font-size="220" font-weight="bold" fill="white">台</text></svg>`),
      sizes: '512x512',
      type: 'image/svg+xml'
    }]
  };

  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  // Apple touch icon
  const appleIcon = document.createElement('link');
  appleIcon.rel = 'apple-touch-icon';
  appleIcon.href = manifest.icons[0].src;
  document.head.appendChild(appleIcon);
}

/* ==================== 应用初始化 ==================== */
function initApp() {
  StorageManager.init();
  setupPWA();
  Router.navigate('dashboard');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
