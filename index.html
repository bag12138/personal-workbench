<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#4A90D9">
<title>个人工作台</title>
<style>
/* ==================== CSS 变量体系 ==================== */
:root {
  /* 主色调 */
  --color-primary: #4A90D9;
  --color-primary-light: #6BA5E0;
  --color-primary-dark: #3A7BC8;
  --color-primary-bg: #EBF3FC;

  /* 功能色 */
  --color-success: #52C41A;
  --color-success-bg: #F0FBEB;
  --color-warning: #FAAD14;
  --color-warning-bg: #FFFBE6;
  --color-danger: #FF4D4F;
  --color-danger-bg: #FFF1F0;
  --color-info: #4A90D9;
  --color-info-bg: #EBF3FC;

  /* 中性色 */
  --color-bg: #F5F6FA;
  --color-bg-white: #FFFFFF;
  --color-bg-gray: #F0F1F5;
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-text-white: #FFFFFF;
  --color-border: #E8E9ED;
  --color-border-light: #F0F1F5;
  --color-divider: #F0F1F5;

  /* 圆角 */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 999px;

  /* 间距 */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
  --space-2xl: 24px;
  --space-3xl: 32px;

  /* 字号 */
  --font-xs: 11px;
  --font-sm: 13px;
  --font-base: 15px;
  --font-md: 16px;
  --font-lg: 18px;
  --font-xl: 20px;
  --font-2xl: 24px;
  --font-3xl: 28px;

  /* 阴影 */
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.1);
  --shadow-card: 0 1px 4px rgba(0,0,0,0.06);

  /* 安全区 */
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --tab-height: 56px;

  /* 字体 */
  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue',
                 Helvetica, Arial, sans-serif;
}

/* ==================== 全局重置 ==================== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-family);
  font-size: var(--font-base);
  color: var(--color-text-primary);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-user-select: none;
}

input, textarea, select {
  font-family: inherit;
  font-size: var(--font-md); /* 防止 iOS 缩放 */
  -webkit-appearance: none;
  appearance: none;
}

button {
  font-family: inherit;
  border: none;
  background: none;
  cursor: pointer;
  color: inherit;
}

ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }

/* ==================== App 容器 ==================== */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ==================== 页面通用样式 ==================== */
.page {
  display: none;
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + var(--space-lg));
}

.page.active {
  display: block;
}

.page-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--color-bg-white);
  padding: calc(var(--safe-top) + var(--space-lg)) var(--space-lg) var(--space-md);
  border-bottom: 1px solid var(--color-border-light);
}

.page-header__title {
  font-size: var(--font-2xl);
  font-weight: 700;
  color: var(--color-text-primary);
}

.page-header__subtitle {
  font-size: var(--font-sm);
  color: var(--color-text-secondary);
  margin-top: var(--space-xs);
}

.page-content {
  padding: var(--space-lg);
}

/* ==================== 底部 Tab Bar ==================== */
#tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--tab-height) + var(--safe-bottom));
  background: var(--color-bg-white);
  border-top: 1px solid var(--color-border-light);
  display: flex;
  z-index: 100;
  padding-bottom: var(--safe-bottom);
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--color-text-tertiary);
  transition: color 0.2s;
  min-height: 44px;
}

.tab-item.active {
  color: var(--color-primary);
}

.tab-item__icon {
  font-size: 22px;
  line-height: 1;
}

.tab-item__label {
  font-size: var(--font-xs);
  font-weight: 500;
}

/* ==================== 卡片 ==================== */
.card {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  box-shadow: var(--shadow-card);
}

.card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
}

.card__title {
  font-size: var(--font-lg);
  font-weight: 600;
  color: var(--color-text-primary);
}

.card__subtitle {
  font-size: var(--font-sm);
  color: var(--color-text-secondary);
}

.card__action {
  font-size: var(--font-sm);
  color: var(--color-primary);
  font-weight: 500;
}

/* ==================== 指标卡片网格 ==================== */
.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}

.metric-card {
  background: var(--color-bg-white);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  box-shadow: var(--shadow-card);
}

.metric-card__label {
  font-size: var(--font-xs);
  color: var(--color-text-secondary);
  margin-bottom: var(--space-sm);
}

.metric-card__value {
  font-size: var(--font-xl);
  font-weight: 700;
  color: var(--color-text-primary);
  line-height: 1.2;
}

.metric-card__value--primary { color: var(--color-primary); }
.metric-card__value--success { color: var(--color-success); }
.metric-card__value--danger { color: var(--color-danger); }

.metric-card__extra {
  font-size: var(--font-xs);
  color: var(--color-text-tertiary);
  margin-top: var(--space-xs);
}

/* ==================== 进度条 ==================== */
.progress-bar {
  height: 8px;
  background: var(--color-bg-gray);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-bar__fill {
  height: 100%;
  background: var(--color-primary);
  border-radius: var(--radius-full);
  transition: width 0.3s ease;
}

.progress-bar__fill--success { background: var(--color-success); }
.progress-bar__fill--warning { background: var(--color-warning); }
.progress-bar__fill--danger { background: var(--color-danger); }

/* ==================== 按钮 ==================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-sm);
  padding: var(--space-md) var(--space-xl);
  border-radius: var(--radius-md);
  font-size: var(--font-base);
  font-weight: 600;
  min-height: 44px;
  transition: opacity 0.2s, transform 0.1s;
}

.btn:active { transform: scale(0.97); }

.btn--primary {
  background: var(--color-primary);
  color: var(--color-text-white);
}

.btn--success {
  background: var(--color-success);
  color: var(--color-text-white);
}

.btn--danger {
  background: var(--color-danger);
  color: var(--color-text-white);
}

.btn--ghost {
  background: var(--color-bg-gray);
  color: var(--color-text-primary);
}

.btn--outline {
  background: transparent;
  border: 1.5px solid var(--color-border);
  color: var(--color-text-primary);
}

.btn--block { width: 100%; }
.btn--sm { padding: var(--space-sm) var(--space-md); min-height: 36px; font-size: var(--font-sm); }

/* FAB 浮动按钮 */
.fab {
  position: fixed;
  bottom: calc(var(--tab-height) + var(--safe-bottom) + var(--space-lg));
  right: var(--space-lg);
  width: 52px;
  height: 52px;
  border-radius: var(--radius-full);
  background: var(--color-primary);
  color: var(--color-text-white);
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(74, 144, 217, 0.4);
  z-index: 50;
  transition: transform 0.2s;
}

.fab:active { transform: scale(0.92); }

/* ==================== 列表 ==================== */
.list-item {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-md) 0;
  border-bottom: 1px solid var(--color-divider);
}

.list-item:last-child { border-bottom: none; }

.list-item__icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.list-item__content {
  flex: 1;
  min-width: 0;
}

.list-item__title {
  font-size: var(--font-base);
  font-weight: 500;
  color: var(--color-text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.list-item__desc {
  font-size: var(--font-sm);
  color: var(--color-text-secondary);
  margin-top: 2px;
}

.list-item__value {
  font-size: var(--font-base);
  font-weight: 600;
  text-align: right;
  flex-shrink: 0;
}

.list-item__value--expense { color: var(--color-text-primary); }
.list-item__value--income { color: var(--color-success); }

/* ==================== 标签 ==================== */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px var(--space-sm);
  border-radius: var(--radius-sm);
  font-size: var(--font-xs);
  font-weight: 500;
  background: var(--color-bg-gray);
  color: var(--color-text-secondary);
}

.tag--primary { background: var(--color-primary-bg); color: var(--color-primary); }
.tag--success { background: var(--color-success-bg); color: var(--color-success); }
.tag--warning { background: var(--color-warning-bg); color: var(--color-warning); }
.tag--danger { background: var(--color-danger-bg); color: var(--color-danger); }

/* ==================== Modal 弹窗 ==================== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 1000;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.active {
  display: flex;
  animation: fadeIn 0.2s ease;
}

.modal {
  background: var(--color-bg-white);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--space-lg);
  padding-bottom: calc(var(--space-lg) + var(--safe-bottom));
  animation: slideUp 0.25s ease;
}

.modal--center {
  border-radius: var(--radius-xl);
  margin: auto var(--space-lg);
  max-width: 400px;
  align-self: center;
}

.modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-lg);
}

.modal__title {
  font-size: var(--font-xl);
  font-weight: 700;
}

.modal__close {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: var(--color-bg-gray);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--color-text-secondary);
}

.modal__body { margin-bottom: var(--space-lg); }

.modal__footer {
  display: flex;
  gap: var(--space-md);
}

.modal__footer .btn { flex: 1; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ==================== 表单 ==================== */
.form-group {
  margin-bottom: var(--space-lg);
}

.form-label {
  display: block;
  font-size: var(--font-sm);
  color: var(--color-text-secondary);
  margin-bottom: var(--space-sm);
  font-weight: 500;
}

.form-input {
  width: 100%;
  padding: var(--space-md) var(--space-lg);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: var(--font-md);
  color: var(--color-text-primary);
  background: var(--color-bg-white);
  transition: border-color 0.2s;
}

.form-input:focus {
  outline: none;
  border-color: var(--color-primary);
}

.form-input::placeholder { color: var(--color-text-tertiary); }

textarea.form-input {
  resize: none;
  min-height: 80px;
}

/* 分类网格选择器 */
.category-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-md);
}

.category-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
  padding: var(--space-md) var(--space-xs);
  border-radius: var(--radius-md);
  border: 2px solid transparent;
  background: var(--color-bg-gray);
  transition: all 0.2s;
}

.category-item.active {
  border-color: var(--color-primary);
  background: var(--color-primary-bg);
}

.category-item__icon {
  font-size: 24px;
}

.category-item__name {
  font-size: var(--font-xs);
  color: var(--color-text-secondary);
}

.category-item.active .category-item__name {
  color: var(--color-primary);
  font-weight: 500;
}

/* Tab 切换组 */
.tab-group {
  display: flex;
  background: var(--color-bg-gray);
  border-radius: var(--radius-md);
  padding: 3px;
  margin-bottom: var(--space-lg);
}

.tab-group__item {
  flex: 1;
  text-align: center;
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-sm);
  font-size: var(--font-sm);
  font-weight: 500;
  color: var(--color-text-secondary);
  transition: all 0.2s;
}

.tab-group__item.active {
  background: var(--color-bg-white);
  color: var(--color-text-primary);
  box-shadow: var(--shadow-sm);
}

/* ==================== Toast 提示 ==================== */
#toast-container {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2000;
  pointer-events: none;
}

.toast {
  background: rgba(0, 0, 0, 0.75);
  color: white;
  padding: var(--space-md) var(--space-xl);
  border-radius: var(--radius-md);
  font-size: var(--font-sm);
  max-width: 280px;
  text-align: center;
  animation: toastIn 0.25s ease;
}

@keyframes toastIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* ==================== 空状态 ==================== */
.empty-state {
  text-align: center;
  padding: var(--space-3xl) var(--space-lg);
  color: var(--color-text-tertiary);
}

.empty-state__icon {
  font-size: 48px;
  margin-bottom: var(--space-md);
  opacity: 0.5;
}

.empty-state__text {
  font-size: var(--font-sm);
}

/* ==================== 自媒体工作台 ==================== */
.media-subtab {
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--color-bg-white);
  border-bottom: 1px solid var(--color-border-light);
  padding: 0 var(--space-lg);
  gap: var(--space-lg);
}

.media-subtab__item {
  padding: var(--space-md) 0;
  font-size: var(--font-base);
  font-weight: 500;
  color: var(--color-text-secondary);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all 0.2s;
}

.media-subtab__item.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}

/* 任务看板 */
.kanban {
  display: flex;
  gap: var(--space-md);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: var(--space-md);
}

.kanban__column {
  flex-shrink: 0;
  width: 240px;
}

.kanban__column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-sm);
  background: var(--color-bg-gray);
}

.kanban__column-title {
  font-size: var(--font-sm);
  font-weight: 600;
  color: var(--color-text-primary);
}

.kanban__column-count {
  font-size: var(--font-xs);
  color: var(--color-text-secondary);
  background: var(--color-bg-white);
  padding: 1px 6px;
  border-radius: var(--radius-full);
}

.kanban__card {
  background: var(--color-bg-white);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  margin-bottom: var(--space-sm);
  box-shadow: var(--shadow-sm);
  border-left: 3px solid var(--color-primary);
}

.kanban__card--priority-high { border-left-color: var(--color-danger); }
.kanban__card--priority-medium { border-left-color: var(--color-warning); }
.kanban__card--priority-low { border-left-color: var(--color-success); }

.kanban__card-title {
  font-size: var(--font-sm);
  font-weight: 500;
  margin-bottom: var(--space-xs);
}

.kanban__card-meta {
  font-size: var(--font-xs);
  color: var(--color-text-tertiary);
}

/* 周日历 */
.week-calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-xs);
}

.week-calendar__day {
  text-align: center;
  padding: var(--space-sm) var(--space-xs);
  border-radius: var(--radius-md);
  background: var(--color-bg-gray);
  min-height: 60px;
}

.week-calendar__day--has-task {
  background: var(--color-primary-bg);
}

.week-calendar__day-label {
  font-size: var(--font-xs);
  color: var(--color-text-tertiary);
}

.week-calendar__day-date {
  font-size: var(--font-sm);
  font-weight: 600;
  margin-top: 2px;
}

.week-calendar__day-icon {
  font-size: 14px;
  margin-top: 2px;
}

/* AI 分析面板 */
.ai-panel {
  background: linear-gradient(135deg, #EBF3FC 0%, #F0F7FF 100%);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  border: 1px solid rgba(74, 144, 217, 0.15);
}

.ai-panel__header {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
}

.ai-panel__icon {
  font-size: 20px;
}

.ai-panel__title {
  font-size: var(--font-base);
  font-weight: 600;
  color: var(--color-primary-dark);
}

.ai-panel__content {
  font-size: var(--font-sm);
  color: var(--color-text-primary);
  line-height: 1.6;
  white-space: pre-wrap;
}

.ai-panel__section {
  margin-bottom: var(--space-md);
}

.ai-panel__section-title {
  font-size: var(--font-sm);
  font-weight: 600;
  color: var(--color-primary-dark);
  margin-bottom: var(--space-xs);
}

.ai-panel__actions {
  display: flex;
  gap: var(--space-sm);
  margin-top: var(--space-md);
}

/* 热力图 */
.heatmap {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.heatmap__cell {
  aspect-ratio: 1;
  border-radius: 3px;
  background: var(--color-bg-gray);
}

.heatmap__cell--l1 { background: #c6e48b; }
.heatmap__cell--l2 { background: #7bc96f; }
.heatmap__cell--l3 { background: #239a3b; }
.heatmap__cell--l4 { background: #196127; }

/* 设置列表 */
.setting-list { background: var(--color-bg-white); border-radius: var(--radius-lg); overflow: hidden; }

.setting-item {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-lg);
  border-bottom: 1px solid var(--color-divider);
  min-height: 48px;
}

.setting-item:last-child { border-bottom: none; }

.setting-item__icon { font-size: 20px; width: 24px; text-align: center; }
.setting-item__content { flex: 1; }
.setting-item__title { font-size: var(--font-base); color: var(--color-text-primary); }
.setting-item__desc { font-size: var(--font-xs); color: var(--color-text-tertiary); margin-top: 2px; }
.setting-item__arrow { color: var(--color-text-tertiary); font-size: 18px; }

/* 加载状态 */
.loading {

/* ==================== 工具函数 ==================== */
const $ = (sel, parent = document) => parent.querySelector(sel);
const $$ = (sel, parent = document) => parent.querySelectorAll(sel);
const uuid = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 5);

function formatDate(date, fmt = 'YYYY-MM-DD') {
  const d = new Date(date);
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0'), min = String(d.getMinutes()).padStart(2, '0');
  if (fmt === 'YYYY-MM-DD') return `${y}-${m}-${day}`;
  if (fmt === 'MM-DD') return `${m}-${day}`;
  if (fmt === 'YYYY-MM') return `${y}-${m}`;
  if (fmt === 'YYYY-MM-DD HH:mm') return `${y}-${m}-${day} ${h}:${min}`;
  return `${y}-${m}-${day}`;
}

function today() { return formatDate(new Date()); }
function nowISO() { return new Date().toISOString(); }

function formatMoney(n, withSymbol = true) {
  const num = Number(n) || 0;
  const str = num.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return withSymbol ? `¥${str}` : str;
}

function formatMoneyShort(n) {
  const num = Number(n) || 0;
  if (Math.abs(num) >= 10000) return `¥${(num / 10000).toFixed(1)}万`;
  return formatMoney(num);
}

function formatNumber(n) {
  const num = Number(n) || 0;
  if (num >= 10000) return `${(num / 10000).toFixed(1)}万`;
  if (num >= 1000) return `${(num / 1000).toFixed(1)}k`;
  return String(num);
}

function getWeekNumber(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}

function getDayOfYear(date) {
  const start = new Date(new Date(date).getFullYear(), 0, 0);
  const diff = new Date(date) - start;
  return Math.floor(diff / 86400000);
}

function daysBetween(d1, d2) {
  return Math.round((new Date(d2) - new Date(d1)) / 86400000);
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 6) return '夜深了';
  if (h < 11) return '早上好';
  if (h < 14) return '中午好';
  if (h < 18) return '下午好';
  if (h < 22) return '晚上好';
  return '夜深了';
}

function getWeekday(date) {
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  return '周' + days[new Date(date).getDay()];
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ==================== StorageManager ==================== */

    },
    saving: {
      annualGoal: { targetAmount: 50000, startDate: formatDate(new Date(new Date().getFullYear(), 0, 1)), endDate: formatDate(new Date(new Date().getFullYear(), 11, 31)), note: '' },

      plan4321: { enabled: false, monthlyIncome: 0, expense: 40, saving: 30, invest: 20, insurance: 10, records: [] },

    },

      weightRecords: [],
      workoutRecords: [],
      foodRecords: [],
      workoutTypes: [
        { id: 'running', name: '跑步', icon: '🏃' },
        { id: 'walking', name: '快走', icon: '🚶' },
        { id: 'cycling', name: '骑行', icon: '🚴' },

    },
    media: {

        {
          id: 'account_pet', name: '抖音宠物号', platform: ['douyin'], type: 'pet',
          description: '猫咪生活日常型，带货赚佣金', updateFrequency: 'daily', updateDays: [1,2,3,4,5,6,7],
          followers: 0, totalVideos: 0, totalEarnings: 0,
          contentCalendar: [], publishRecords: [], topicPool: [], scriptTemplates: [], aiAnalyses: [],
          productPool: []
        },
        {
          id: 'account_vlog', name: '个人vlog号', platform: ['xiaohongshu', 'douyin'], type: 'vlog',
          description: '生活方式类，小红书+抖音双平台', updateFrequency: 'weekly', updateDays: [3, 6],
          followers: 0, totalVideos: 0, totalEarnings: 0,
          contentCalendar: [], publishRecords: [], topicPool: [], scriptTemplates: [], aiAnalyses: []
        },
        {
          id: 'account_local', name: '本地团购号', platform: ['douyin'], type: 'local_deal',
          description: '多品类混合团购带货', updateFrequency: 'daily', updateDays: [1,2,3,4,5,6],

          contentCalendar: [], publishRecords: [], topicPool: [], scriptTemplates: [], aiAnalyses: [],
          merchantContacts: []
        }
      ]
    },
    inspiration: { items: [] },
    aiCallLog: { date: '', count: 0 }
  },

  data: null,

  init() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        this.data = JSON.parse(raw);
        this.migrate();
      } else {
        this.data = JSON.parse(JSON.stringify(this.defaultData));
        this.save();
      }
    } catch (e) {
      console.error('Storage init error:', e);
      this.data = JSON.parse(JSON.stringify(this.defaultData));
      this.save();
    }
  },

  migrate() {
    if (!this.data.version) this.data.version = 1;
    const defaults = JSON.parse(JSON.stringify(this.defaultData));
    for (const key in defaults) {
      if (this.data[key] === undefined) {
        this.data[key] = defaults[key];
      } else if (typeof defaults[key] === 'object' && !Array.isArray(defaults[key])) {
        for (const subKey in defaults[key]) {
          if (this.data[key][subKey] === undefined) {
            this.data[key][subKey] = defaults[key][subKey];
          }
        }
      }
    }
  },

  save() {
    this.data.lastModified = nowISO();
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.data));
    } catch (e) {
      console.error('Save error:', e);
      UI.toast('保存失败，存储空间可能不足');
    }
  },

  get(path) {
    return path.split('.').reduce((obj, key) => obj?.[key], this.data);
  },

  set(path, value) {
    const keys = path.split('.');
    const last = keys.pop();
    const obj = keys.reduce((o, k) => o[k] = o[k] || {}, this.data);
    obj[last] = value;
    this.save();
  },

  getSetting(key) { return this.data.settings[key]; },
  setSetting(key, value) { this.data.settings[key] = value; this.save(); },

  export() {
    return JSON.stringify({
      appName: '个人工作台',
      exportDate: nowISO(),
      dataVersion: this.VERSION,
      data: this.data
    }, null, 2);
  },

  import(jsonStr) {
    const parsed = JSON.parse(jsonStr);
    if (!parsed.data) throw new Error('文件格式不正确');
    this.data = parsed.data;
    this.migrate();
    this.save();
  }
};

/* ==================== StateManager ==================== */
const StateManager = {
  listeners: {},
  state: { currentPage: 'dashboard', currentMediaAccount: 0 },

  on(event, callback) {
    if (!this.listeners[event]) this.listeners[event] = [];
    this.listeners[event].push(callback);
  },

  emit(event, data) {
    (this.listeners[event] || []).forEach(cb => cb(data));
  },

  setState(key, value) {
    this.state[key] = value;
    this.emit('state:' + key, value);
  }
};

/* ==================== Router ==================== */
const Router = {
  pages: ['dashboard', 'accounting', 'saving', 'fitness', 'media', 'settings'],

  navigate(pageId) {
    this.pages.forEach(p => {
      const el = $('#page-' + p);
      if (el) el.classList.toggle('active', p === pageId);
    });
    $$('.tab-item').forEach((tab, i) => {
      const map = ['dashboard', 'accounting', 'saving', 'fitness', 'media'];
      tab.classList.toggle('active', map[i] === pageId);
    });
    StateManager.setState('currentPage', pageId);

    const controllers = {
      dashboard: () => Dashboard.render(),
      accounting: () => Accounting.render(),
      saving: () => Saving.render(),
      fitness: () => Fitness.render(),
      media: () => Media.render(),
      settings: () => Settings.render()
    };
    if (controllers[pageId]) controllers[pageId]();
    window.scrollTo(0, 0);
    const activePage = $('#page-' + pageId);
    if (activePage) activePage.scrollTop = 0;
  }
};

/* ==================== UI 工具 ==================== */
const UI = {
  toast(msg, duration = 2000) {
    const container = $('#toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, duration);
  },

  modal(html, options = {}) {
    const overlay = $('#modal-overlay');
    const modal = $('#modal');
    modal.className = 'modal' + (options.center ? ' modal--center' : '');
    modal.innerHTML = html;
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    overlay.onclick = (e) => {
      if (e.target === overlay && options.closeOnOverlay !== false) this.closeModal();
    };
  },

  closeModal() {
    $('#modal-overlay').classList.remove('active');
    document.body.style.overflow = '';
  },

  confirm(message, title = '确认', onConfirm) {
    this.modal(`
      <div class="modal__header"><div class="modal__title">${title}</div></div>
      <div class="modal__body" style="font-size:var(--font-base);color:var(--color-text-secondary);line-height:1.6;">${message}</div>
      <div class="modal__footer">
        <button class="btn btn--ghost" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" id="confirm-btn">确认</button>
      </div>
    `, { center: true });
    $('#confirm-btn').onclick = () => { this.closeModal(); if (onConfirm) onConfirm(); };
  },

  emptyState(icon, text) {
    return `<div class="empty-state"><div class="empty-state__icon">${icon}</div><div class="empty-state__text">${text}</div></div>`;
  },

  loading(text = '加载中...') {

/* ==================== Charts (SVG 图表引擎) ==================== */
const Charts = {
  colors: ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8', '#B0B0B0'],

  donut(data, options = {}) {
    const size = options.size || 160;
    const strokeWidth = options.strokeWidth || 16;
    const r = (size - strokeWidth) / 2;
    const cx = size / 2, cy = size / 2;
    const circumference = 2 * Math.PI * r;
    const total = data.reduce((a, b) => a + (b.value || 0), 0);
    if (total === 0) return `<div class="chart-container" style="text-align:center;padding:20px;color:var(--color-text-tertiary);font-size:var(--font-sm);">暂无数据</div>`;

    let offset = 0;
    const segments = data.map((item, i) => {
      const pct = (item.value || 0) / total;
      const segment = pct * circumference;
      const dasharray = `${segment} ${circumference - segment}`;
      const dashoffset = -offset;
      offset += segment;
      const color = item.color || this.colors[i % this.colors.length];
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    }).join('');

    const legend = data.map((item, i) => {
      const color = item.color || this.colors[i % this.colors.length];
      const pct = total > 0 ? ((item.value || 0) / total * 100).toFixed(1) : 0;
      return `<div class="flex-between" style="padding:4px 0;font-size:var(--font-sm);">
        <span class="flex-center gap-sm"><span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;"></span>${item.label || ''}</span>
        <span class="text-tertiary">${pct}%</span>
      </div>`;
    }).join('');

    return `<div class="chart-container flex" style="gap:var(--space-lg);align-items:center;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">${segments}
        <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="14" fill="var(--color-text-tertiary)">总支出</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--color-text-primary)">${formatMoneyShort(total)}</text>
      </svg>
      <div style="flex:1;min-width:0;">${legend}</div>
    </div>`;
  },

  line(data, options = {}) {
    if (!data || data.length === 0) return `<div class="chart-container" style="text-align:center;padding:20px;color:var(--color-text-tertiary);font-size:var(--font-sm);">暂无数据</div>`;
    const width = options.width || 320;
    const height = options.height || 160;
    const padding = { top: 15, right: 15, bottom: 25, left: 40 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;
    const values = data.map(d => d.value || 0);
    const maxVal = Math.max(...values, 1);
    const minVal = Math.min(...values, 0);
    const range = maxVal - minVal || 1;

    const points = data.map((d, i) => ({
      x: padding.left + (data.length === 1 ? chartW / 2 : (i / (data.length - 1)) * chartW),
      y: padding.top + chartH - ((d.value - minVal) / range) * chartH,
      label: d.label || '',
      value: d.value || 0
    }));

    const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const areaD = pathD + ` L ${points[points.length-1].x.toFixed(1)} ${padding.top + chartH} L ${points[0].x.toFixed(1)} ${padding.top + chartH} Z`;
    const color = options.color || '#4A90D9';

    const gridLines = [0, 0.25, 0.5, 0.75, 1].map(t => {
      const y = padding.top + chartH * (1 - t);
      const val = minVal + range * t;
      return `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="var(--color-border-light)" stroke-width="0.5"/>
              <text x="${padding.left - 5}" y="${y + 3}" text-anchor="end" font-size="10" fill="var(--color-text-tertiary)">${options.formatY ? options.formatY(val) : val.toFixed(0)}</text>`;
    }).join('');

    const xLabels = points.filter((_, i) => i % Math.ceil(points.length / 6) === 0 || i === points.length - 1)
      .map(p => `<text x="${p.x}" y="${height - 8}" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">${p.label}</text>`).join('');

    const dots = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}" stroke="white" stroke-width="1.5"/>`).join('');

    const gradientId = 'grad-' + uuid();
    return `<div class="chart-container">
      <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}">
        <defs><linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient></defs>
        ${gridLines}
        <path d="${areaD}" fill="url(#${gradientId})"/>
        <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
        ${xLabels}
      </svg>
    </div>`;
  },

  bar(data, options = {}) {
    if (!data || data.length === 0) return `<div class="chart-container" style="text-align:center;padding:20px;color:var(--color-text-tertiary);font-size:var(--font-sm);">暂无数据</div>`;
    const width = options.width || 320;
    const height = options.height || 160;
    const padding = { top: 15, right: 10, bottom: 25, left: 40 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;

    const maxVal = Math.max(...data.flatMap(d => [d.income || 0, d.expense || 0]), 1);
    const groupWidth = chartW / data.length;
    const barWidth = Math.min(groupWidth * 0.3, 16);

    const gridLines = [0, 0.5, 1].map(t => {
      const y = padding.top + chartH * (1 - t);
      const val = maxVal * t;
      return `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="var(--color-border-light)" stroke-width="0.5"/>
              <text x="${padding.left - 5}" y="${y + 3}" text-anchor="end" font-size="10" fill="var(--color-text-tertiary)">${formatMoneyShort(val)}</text>`;
    }).join('');

    const bars = data.map((d, i) => {
      const cx = padding.left + i * groupWidth + groupWidth / 2;
      const incomeH = (d.income || 0) / maxVal * chartH;
      const expenseH = (d.expense || 0) / maxVal * chartH;
      return `
        <rect x="${cx - barWidth - 2}" y="${padding.top + chartH - incomeH}" width="${barWidth}" height="${incomeH}" fill="#52C41A" rx="2"/>
        <rect x="${cx + 2}" y="${padding.top + chartH - expenseH}" width="${barWidth}" height="${expenseH}" fill="#FF6B6B" rx="2"/>
        <text x="${cx}" y="${height - 8}" text-anchor="middle" font-size="10" fill="var(--color-text-tertiary)">${d.label || ''}</text>
      `;
    }).join('');

    return `<div class="chart-container">
      <svg width="100%" height="${height}" viewBox="0 0 ${width} ${height}">
        ${gridLines}
        ${bars}
      </svg>
      <div class="flex-center gap-lg" style="justify-content:flex-end;font-size:var(--font-xs);margin-top:var(--space-sm);">
        <span class="flex-center gap-sm"><span style="width:10px;height:10px;border-radius:2px;background:#52C41A;display:inline-block;"></span>收入</span>
        <span class="flex-center gap-sm"><span style="width:10px;height:10px;border-radius:2px;background:#FF6B6B;display:inline-block;"></span>支出</span>
      </div>
    </div>`;
  },

  heatmap(records, options = {}) {
    const year = options.year || new Date().getFullYear();
    const daysInYear = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 366 : 365;
    const start = new Date(year, 0, 1);
    const startDay = start.getDay() || 7;

    const recordMap = {};
    records.forEach(r => {
      if (!recordMap[r.date]) recordMap[r.date] = 0;
      recordMap[r.date] += r.amount || 0;
    });

    const maxAmount = Math.max(...Object.values(recordMap), 1);
    let cells = '';
    for (let i = 0; i < startDay - 1; i++) {
      cells += `<div class="heatmap__cell" style="background:transparent;"></div>`;
    }
    for (let i = 0; i < daysInYear; i++) {
      const date = new Date(year, 0, i + 1);
      const dateStr = formatDate(date);
      const amount = recordMap[dateStr] || 0;
      let level = '';
      if (amount > 0) {
        const ratio = amount / maxAmount;
        if (ratio > 0.75) level = 'heatmap__cell--l4';
        else if (ratio > 0.5) level = 'heatmap__cell--l3';
        else if (ratio > 0.25) level = 'heatmap__cell--l2';
        else level = 'heatmap__cell--l1';
      }
      cells += `<div class="heatmap__cell ${level}" title="${dateStr}: ${amount > 0 ? formatMoney(amount) : '未存'}"></div>`;
    }

    return `<div class="chart-container">
      <div class="heatmap">${cells}</div>
      <div class="flex-center gap-sm" style="justify-content:flex-end;margin-top:var(--space-sm);font-size:var(--font-xs);color:var(--color-text-tertiary);">
        <span>少</span>
        <span class="heatmap__cell" style="width:10px;height:10px;"></span>
        <span class="heatmap__cell heatmap__cell--l1" style="width:10px;height:10px;"></span>
        <span class="heatmap__cell heatmap__cell--l2" style="width:10px;height:10px;"></span>
        <span class="heatmap__cell heatmap__cell--l3" style="width:10px;height:10px;"></span>
        <span class="heatmap__cell heatmap__cell--l4" style="width:10px;height:10px;"></span>
        <span>多</span>
      </div>
    </div>`;
  }
};

/* ==================== 记账模块 ==================== */
const Accounting = {
  currentMonth: new Date(),
  viewMode: 'month',

  render() {
    this.updateMonthLabel();
    this.renderContent();
  },

  updateMonthLabel() {
    const m = this.currentMonth;
    $('#acc-month-label').textContent = `${m.getFullYear()}年${m.getMonth() + 1}月`;
  },

  prevMonth() {
    this.currentMonth = new Date(this.currentMonth.getFullYear(), this.currentMonth.getMonth() - 1, 1);
    this.updateMonthLabel();
    this.renderContent();
  },

  nextMonth() {
    this.currentMonth = new Date(this.currentMonth.getFullYear(), this.currentMonth.getMonth() + 1, 1);
    this.updateMonthLabel();
    this.renderContent();
  },

  renderContent() {
    const container = $('#accounting-content');
    const year = this.currentMonth.getFullYear();
    const month = this.currentMonth.getMonth();
    const records = StorageManager.data.accounting.records.filter(r => {
      const d = new Date(r.date);
      return d.getFullYear() === year && d.getMonth() === month;
    }).sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));

    const income = records.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
    const expense = records.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
    const balance = income - expense;

    let html = `
      <div class="card">
        <div class="flex-between mb-md">
          <span class="text-sm text-secondary">本月收支概览</span>
          <div class="tab-group" style="margin:0;width:auto;">
            <span class="tab-group__item ${this.viewMode==='month'?'active':''}" onclick="Accounting.setView('month')">月</span>
            <span class="tab-group__item ${this.viewMode==='year'?'active':''}" onclick="Accounting.setView('year')">年</span>
          </div>
        </div>
        <div class="metric-grid" style="margin:0;">
          <div class="metric-card" style="background:var(--color-success-bg);box-shadow:none;">
            <div class="metric-card__label">收入</div>
            <div class="metric-card__value metric-card__value--success">${formatMoney(income)}</div>
          </div>
          <div class="metric-card" style="background:var(--color-danger-bg);box-shadow:none;">
            <div class="metric-card__label">支出</div>
            <div class="metric-card__value metric-card__value--danger">${formatMoney(expense)}</div>
          </div>
        </div>
        <div class="flex-between mt-md" style="padding:var(--space-md);background:var(--color-bg-gray);border-radius:var(--radius-md);">
          <span class="text-sm text-medium">结余</span>
          <span class="text-lg text-bold ${balance >= 0 ? 'text-success' : 'text-danger'}">${formatMoney(balance)}</span>
        </div>
      </div>
    `;

    if (this.viewMode === 'month') {
      const categories = StorageManager.data.accounting.categories.expense;
      const categoryTotals = {};
      records.filter(r => r.type === 'expense').forEach(r => {
        categoryTotals[r.categoryId] = (categoryTotals[r.categoryId] || 0) + r.amount;
      });
      const donutData = categories
        .map(c => ({ label: c.name, value: categoryTotals[c.id] || 0, color: c.color }))
        .filter(d => d.value > 0)
        .sort((a, b) => b.value - a.value);

      if (donutData.length > 0) {
        html += `<div class="card"><div class="card__header"><span class="card__title">支出分类</span></div>${Charts.donut(donutData)}</div>`;
      }

      const recent6Months = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(year, month - i, 1);
        const mRecords = StorageManager.data.accounting.records.filter(r => {
          const rd = new Date(r.date);
          return rd.getFullYear() === d.getFullYear() && rd.getMonth() === d.getMonth();
        });
        recent6Months.push({
          label: `${d.getMonth() + 1}月`,
          income: mRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0),
          expense: mRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0)
        });
      }
      html += `<div class="card"><div class="card__header"><span class="card__title">近6月趋势</span></div>${Charts.bar(recent6Months)}</div>`;
    } else {
      const yearRecords = StorageManager.data.accounting.records.filter(r => {
        const d = new Date(r.date);
        return d.getFullYear() === year;
      });
      const months = [];
      for (let i = 0; i < 12; i++) {
        const mRecords = yearRecords.filter(r => new Date(r.date).getMonth() === i);
        months.push({
          label: `${i + 1}月`,
          income: mRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0),
          expense: mRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0)
        });
      }
      html += `<div class="card"><div class="card__header"><span class="card__title">${year}年收支趋势</span></div>${Charts.bar(months)}</div>`;
    }

    html += `<div class="card"><div class="card__header"><span class="card__title">收支记录</span><span class="text-sm text-tertiary">${records.length}条</span></div>`;
    if (records.length === 0) {
      html += UI.emptyState('📝', '本月还没有记录，点击右下角 + 开始记账');
    } else {
      html += '<div>';
      records.forEach(r => {
        const cat = this.findCategory(r.categoryId, r.type);
        html += `
          <div class="list-item" onclick="Accounting.showAddModal(StorageManager.data.accounting.records.find(r=>r.id==='${r.id}'))" style="cursor:pointer;">
            <div class="list-item__icon" style="background:${cat ? cat.color + '20' : 'var(--color-bg-gray)'};">${cat ? cat.icon : '📌'}</div>
            <div class="list-item__content">
              <div class="list-item__title">${escapeHtml(r.note) || cat?.name || '未分类'}</div>
              <div class="list-item__desc">${formatDate(r.date, 'MM-DD')} · ${cat?.name || '其他'}</div>
            </div>
            <div class="list-item__value list-item__value--${r.type === 'income' ? 'income' : 'expense'}">${r.type === 'income' ? '+' : '-'}${formatMoney(r.amount)}</div>
          </div>
        `;
      });
      html += '</div>';
    }
    html += '</div>';

    container.innerHTML = html;
  },

  setView(mode) {
    this.viewMode = mode;
    this.renderContent();
  },

  findCategory(id, type) {
    const cats = StorageManager.data.accounting.categories[type === 'income' ? 'income' : 'expense'];
    return cats.find(c => c.id === id);
  },

  showAddModal(record = null) {
    const isEdit = !!record;
    const cats = StorageManager.data.accounting.categories;
    let currentType = record?.type || 'expense';
    let selectedCat = record?.categoryId || '';
    this._currentType = currentType;
    this._selectedCat = selectedCat;

    const renderCategories = (type) => {
      return cats[type === 'income' ? 'income' : 'expense'].map(c => `
        <div class="category-item ${selectedCat === c.id ? 'active' : ''}" onclick="Accounting.selectCategory('${c.id}', this)">
          <span class="category-item__icon">${c.icon}</span>
          <span class="category-item__name">${c.name}</span>
        </div>
      `).join('');
    };

    UI.modal(`
      <div class="modal__header">
        <div class="modal__title">${isEdit ? '编辑记录' : '记一笔'}</div>
        <div class="modal__close" onclick="UI.closeModal()">✕</div>
      </div>
      <div class="modal__body">
        <div class="tab-group" id="acc-type-tabs">
          <div class="tab-group__item ${currentType==='expense'?'active':''}" onclick="Accounting.switchType('expense')">支出</div>
          <div class="tab-group__item ${currentType==='income'?'active':''}" onclick="Accounting.switchType('income')">收入</div>
        </div>
        <div class="form-group">
          <label class="form-label">金额</label>
          <input type="number" class="form-input" id="acc-amount" placeholder="0.00" step="0.01" value="${record?.amount || ''}" style="font-size:24px;font-weight:700;text-align:center;">
        </div>
        <div class="form-group">
          <label class="form-label">分类</label>
          <div class="category-grid" id="acc-category-grid">${renderCategories(currentType)}</div>
        </div>
        <div class="form-group">
          <label class="form-label">日期</label>
          <input type="date" class="form-input" id="acc-date" value="${record?.date || today()}">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <input type="text" class="form-input" id="acc-note" placeholder="选填" value="${escapeHtml(record?.note) || ''}">
        </div>
      </div>
      <div class="modal__footer">
        ${isEdit ? `<button class="btn btn--danger" onclick="Accounting.deleteRecord('${record.id}')">删除</button>` : ''}
        <button class="btn btn--ghost" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="Accounting.saveRecord(${isEdit ? `'${record.id}'` : 'null'})">${isEdit ? '保存' : '确认'}</button>
      </div>
    `);
  },

  switchType(type) {
    this._currentType = type;
    this._selectedCat = '';
    $$('#acc-type-tabs .tab-group__item').forEach((el, i) => {
      el.classList.toggle('active', (type === 'expense' && i === 0) || (type === 'income' && i === 1));
    });
    $('#acc-category-grid').innerHTML = StorageManager.data.accounting.categories[type === 'income' ? 'income' : 'expense'].map(c => `
      <div class="category-item" onclick="Accounting.selectCategory('${c.id}', this)">
        <span class="category-item__icon">${c.icon}</span>
        <span class="category-item__name">${c.name}</span>
      </div>
    `).join('');
  },

  selectCategory(id, el) {
    this._selectedCat = id;
    $$('#acc-category-grid .category-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
  },

  saveRecord(id) {
    const amount = parseFloat($('#acc-amount').value);
    if (!amount || amount <= 0) { UI.toast('请输入有效金额'); return; }
    const type = this._currentType || 'expense';
    const categoryId = this._selectedCat;
    if (!categoryId) { UI.toast('请选择分类'); return; }
    const date = $('#acc-date').value;
    const note = $('#acc-note').value.trim();

    const records = StorageManager.data.accounting.records;
    if (id) {
      const idx = records.findIndex(r => r.id === id);
      if (idx >= 0) {
        records[idx] = { ...records[idx], type, amount, categoryId, date, note };
      }
    } else {
      records.push({ id: uuid(), type, amount, categoryId, date, note, createdAt: nowISO() });
    }
    StorageManager.save();
    UI.closeModal();
    UI.toast(id ? '已更新' : '已记录');
    this.renderContent();
  },

  deleteRecord(id) {
    UI.confirm('确定删除这条记录？', '删除', () => {
      StorageManager.data.accounting.records = StorageManager.data.accounting.records.filter(r => r.id !== id);
      StorageManager.save();
      UI.closeModal();
      UI.toast('已删除');
      this.renderContent();
    });
  }
};

  localAnalysis() {
    const data = StorageManager.data.saving;
    const annualGoal = data.annualGoal;
    const totalSaved = data.dailyRecords.reduce((s, r) => s + r.amount, 0);
    const progressPct = annualGoal.targetAmount > 0 ? (totalSaved / annualGoal.targetAmount * 100) : 0;
    const year = new Date().getFullYear();
    const daysElapsed = getDayOfYear(new Date());
    const daysInYear = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0 ? 366 : 365;
    const expectedPct = daysElapsed / daysInYear * 100;
    const deviation = progressPct - expectedPct;

    const now = new Date();
    const monthRecords = StorageManager.data.accounting.records.filter(r => {
      const d = new Date(r.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
    const monthIncome = monthRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
    const monthExpense = monthRecords.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
    const surplusRate = monthIncome > 0 ? ((monthIncome - monthExpense) / monthIncome * 100) : 0;
    const monthSaved = data.dailyRecords.filter(r => {
      const d = new Date(r.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }).reduce((s, r) => s + r.amount, 0);

    let streak = 0;
    const sortedRecords = [...data.dailyRecords].sort((a, b) => b.date.localeCompare(a.date));
    let checkDate = today();
    for (const r of sortedRecords) {
      if (r.date === checkDate) {
        streak++;
        const d = new Date(checkDate);
        d.setDate(d.getDate() - 1);
        checkDate = formatDate(d);
      } else if (r.date < checkDate) {
        break;
      }
    }

    const suggestions = [];
    let message = '';

    if (deviation >= 0) {
      message = `存钱进度良好，已完成年度目标的 ${progressPct.toFixed(1)}%，超前预期 ${deviation.toFixed(1)}%。`;
    } else {
      message = `存钱进度 ${progressPct.toFixed(1)}%，落后预期 ${Math.abs(deviation).toFixed(1)}%，需要加把劲。`;
    }

    if (surplusRate > 0) {
      message += `\n本月结余率 ${surplusRate.toFixed(1)}%`;
      if (surplusRate >= 30) message += '，表现优秀。';
      else if (surplusRate >= 15) message += '，尚可优化。';
      else message += '，支出偏高。';
    }

    if (streak > 0) message += `\n已连续存钱 ${streak} 天，继续保持！`;

    const dailyTarget = (annualGoal.targetAmount - totalSaved) / Math.max(daysInYear - daysElapsed, 1);
    suggestions.push(`剩余 ${daysInYear - daysElapsed} 天，日均需存 ${formatMoney(dailyTarget)} 达到年度目标`);

    if (monthSaved > 0) {
      suggestions.push(`本月已存 ${formatMoney(monthSaved)}`);
    }

    if (surplusRate < 15 && monthIncome > 0) {
      const topCategory = this.getTopExpenseCategory(monthRecords.filter(r => r.type === 'expense'));
      if (topCategory) {
        suggestions.push(`支出最高分类：${topCategory.name} ${formatMoney(topCategory.total)}，建议控制`);
      }
    }

    // 负债分析
    const debts = data.debts || [];
    const totalDebt = debts.reduce((s, d) => s + (d.amount || 0), 0);
    const netAssets = totalSaved - totalDebt;
    if (totalDebt > 0) {
      message += `\n当前负债 ${formatMoney(totalDebt)}，净资产 ${formatMoney(netAssets)}。`;
      if (netAssets < 0) {
        suggestions.push(`⚠️ 净资产为负，建议优先还债，减少非必要支出`);
      } else {
        suggestions.push(`负债率 ${(totalDebt / (totalSaved + totalDebt) * 100).toFixed(1)}%，可考虑加速还债`);
      }
    }

    // 4321分析
    const p4321 = data.plan4321 || {};
    if (p4321.enabled && p4321.monthlyIncome > 0) {
      const shouldSave = p4321.monthlyIncome * p4321.saving / 100;
      suggestions.push(`4321法建议月存 ${formatMoney(shouldSave)}（收入的${p4321.saving}%）`);
    }

    return { message, suggestions, surplusRate, progressPct, deviation, monthSaved, streak, totalSaved, monthIncome, monthExpense, totalDebt, netAssets };
  },

  getTopExpenseCategory(records) {
    const map = {};
    records.forEach(r => { map[r.categoryId] = (map[r.categoryId] || 0) + r.amount; });
    const cats = StorageManager.data.accounting.categories.expense;
    let top = null;
    for (const id in map) {
      const cat = cats.find(c => c.id === id);
      if (!top || map[id] > top.total) {
        top = { id, name: cat?.name || '其他', total: map[id] };
      }
    }
    return top;
  },

  render() {

    const data = StorageManager.data.fitness;
    const goal = data.weightGoal;
    const latestWeight = data.weightRecords.length > 0
      ? [...data.weightRecords].sort((a, b) => b.date.localeCompare(a.date))[0].weight

    const remaining = latestWeight - goal.targetWeight;

      ? Math.min(Math.max((goal.startWeight - latestWeight) / (goal.startWeight - goal.targetWeight) * 100, 0), 100)
      : 100;

    let html = `
      <div class="card">
        <div class="card__header">
          <span class="card__title">体重目标</span>
          <span class="card__action" onclick="Fitness.showGoalModal()">编辑</span>

        <div class="flex-between mb-md">
          <div>
            <div class="text-2xl text-bold">${latestWeight}<span class="text-sm text-tertiary"> kg</span></div>
            <div class="text-xs text-tertiary">目标 ${goal.targetWeight} kg</div>
          </div>
          <div class="text-right">
            <div class="text-lg text-bold ${totalChange <= 0 ? 'text-success' : 'text-danger'}">${totalChange <= 0 ? '' : '+'}${totalChange.toFixed(1)} kg</div>
            <div class="text-xs text-tertiary">${totalChange <= 0 ? '已减重' : '增重了'}</div>
          </div>
        </div>
        <div class="progress-bar mb-sm">
          <div class="progress-bar__fill ${progressPct >= 75 ? 'progress-bar__fill--success' : ''}" style="width:${progressPct}%"></div>
        </div>
        <div class="flex-between text-xs text-tertiary">
          <span>起始 ${goal.startWeight} kg</span>
          <span>还需 ${remaining > 0 ? remaining.toFixed(1) + ' kg' : '已达标 🎉'}</span>
        </div>
      </div>
    `;

    const weightData = [...data.weightRecords].sort((a, b) => a.date.localeCompare(b.date)).slice(-30).map(r => ({
      label: formatDate(r.date, 'MM-DD'),
      value: r.weight

    if (weightData.length > 0) {
      html += `<div class="card">
        <div class="card__header"><span class="card__title">体重趋势</span><span class="text-sm text-tertiary">近${weightData.length}次</span></div>
        ${Charts.line(weightData, { formatY: v => v.toFixed(0) + 'kg' })}
      </div>`;
    }

    const now = new Date();
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - ((now.getDay() || 7) - 1));
    const weekWorkouts = data.workoutRecords.filter(r => new Date(r.date) >= weekStart);
    const weekDuration = weekWorkouts.reduce((s, r) => s + (r.duration || 0), 0);

    html += `<div class="card">
      <div class="card__header"><span class="card__title">本周运动</span><span class="text-sm text-tertiary">${weekWorkouts.length}次 · ${weekDuration}分钟</span></div>`;
    if (weekWorkouts.length === 0) {
      html += '<div class="text-sm text-tertiary text-center" style="padding:var(--space-lg);">本周还没有运动记录</div>';
    } else {
      html += '<div>';
      [...weekWorkouts].sort((a, b) => b.date.localeCompare(a.date)).forEach(r => {
        const type = data.workoutTypes.find(t => t.id === r.type);
        const intensityLabel = { low: '低强度', medium: '中强度', high: '高强度' }[r.intensity] || '';

            </div>
            <span class="tag ${intensityTag}">${intensityLabel}</span>
          </div>
        `;
      });
      html += '</div>';
    }
    html += '</div>';

    const recentWeights = [...data.weightRecords].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
    html += `<div class="card">
      <div class="card__header"><span class="card__title">体重记录</span><span class="text-sm text-tertiary">${data.weightRecords.length}条</span></div>`;
    if (recentWeights.length === 0) {
      html += UI.emptyState('⚖️', '还没有体重记录');
    } else {
      html += '<div>';
      recentWeights.forEach(r => {

          <div class="list-item">
            <div class="list-item__icon" style="background:var(--color-info-bg);">⚖️</div>
            <div class="list-item__content">

    html += `<div class="card">

        <span class="card__action" onclick="Fitness.showAddFood()">+ 记录</span>

  saveRecord() {
    const tab = this._fitTab || 'weight';

      if (!weight || weight <= 0) { UI.toast('请输入有效体重'); return; }
      const bodyFat = $('#fit-bodyfat').value ? parseFloat($('#fit-bodyfat').value) : null;
      StorageManager.data.fitness.weightRecords.push({

    StorageManager.data.fitness.foodRecords.push({
      id: uuid(), date: $('#food-date').value, meal: $('#food-meal').value,
      food, calories: parseInt($('#food-calories').value) || 0,
      note: $('#food-note').value.trim(), createdAt: nowISO()
    });
    StorageManager.save();
    UI.closeModal();
    UI.toast('已记录');
    this.render();
  },

    const resultDiv = $('#fitness-ai-result');
    if (!AIAnalyzer.checkApiKey()) {
      UI.toast('请先在设置中配置 API Key');
      Router.navigate('settings');
      return;
    }
    resultDiv.innerHTML = UI.loading('AI 分析中...');
    try {
      const result = await AIAnalyzer.analyzeDiet();
      resultDiv.innerHTML = `<div class="ai-panel__section mt-md"><div class="ai-panel__section-title">🤖 AI 饮食建议</div><div class="ai-panel__content">${escapeHtml(result)}</div></div>`;

      resultDiv.innerHTML = `<div class="text-sm text-danger mt-md">分析失败：${escapeHtml(e.message)}</div>`;

        <button class="btn btn--primary" onclick="Fitness.saveGoal()">保存</button>
      </div>

    const target = parseFloat($('#fg-target').value);
    const start = parseFloat($('#fg-start').value);
    if (!target || !start) { UI.toast('请输入有效体重'); return; }
    StorageManager.data.fitness.weightGoal.targetWeight = target;
    StorageManager.data.fitness.weightGoal.startWeight = start;
    StorageManager.save();
    UI.closeModal();
    UI.toast('目标已更新');
    this.render();

/* ==================== 自媒体工作台 ==================== */
const Media = {
  currentAccount: 0,

  switchAccount(idx) {
    this.currentAccount = idx;
    $$('#media-subtab .media-subtab__item').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });
    this.render();
  },

  switchAccountAndRender(idx) {
    Router.navigate('media');
    setTimeout(() => this.switchAccount(idx), 50);
  },

  render() {
    const container = $('#media-content');
    if (this.currentAccount === 3) {
      Inspiration.render(container);
      return;
    }
    const acc = StorageManager.data.media.accounts[this.currentAccount];
    if (!acc) return;

    const pending = acc.contentCalendar.filter(c => c.status !== 'published').length;
    const published = acc.publishRecords.length;
    const totalViews = acc.publishRecords.reduce((s, r) => s + (r.views || 0), 0);
    const totalCommission = acc.publishRecords.reduce((s, r) => s + (r.commission || 0), 0);

    let html = `
      <div class="card">
        <div class="flex-between">
          <div>
            <div class="text-lg text-bold">${acc.name}</div>
            <div class="text-sm text-tertiary mt-sm">${acc.description}</div>
          </div>
          <div class="flex gap-sm flex-wrap" style="justify-content:flex-end;">
            <span class="tag tag--primary">${acc.platform.map(p => ({douyin:'抖音', xiaohongshu:'小红书'})[p] || p).join('+')}</span>

            <div class="metric-card__value">${pending}</div>

            <div class="metric-card__label">已发布</div>
            <div class="metric-card__value">${published}</div>
          </div>
          <div class="metric-card" style="background:var(--color-bg-gray);box-shadow:none;padding:var(--space-md);">
            <div class="metric-card__label">总播放</div>
            <div class="metric-card__value">${formatNumber(totalViews)}</div>
          </div>
          <div class="metric-card" style="background:var(--color-bg-gray);box-shadow:none;padding:var(--space-md);">
            <div class="metric-card__label">${acc.type === 'pet' || acc.type === 'local_deal' ? '总佣金' : '总收益'}</div>
            <div class="metric-card__value">${formatMoneyShort(totalCommission)}</div>

    // 快捷操作
    html += `<div class="flex gap-md mb-md">
      <button class="btn btn--primary btn--block btn--sm" onclick="Media.showAddTopic()">📝 选题</button>
      <button class="btn btn--ghost btn--block btn--sm" onclick="Media.showAddContent()">📅 排期</button>
      <button class="btn btn--ghost btn--block btn--sm" onclick="Media.showAddPublish()">📤 发布记录</button>
    </div>`;

    // AI 行业分析
    const latestAnalysis = acc.aiAnalyses.length > 0 ? [...acc.aiAnalyses].sort((a, b) => b.date.localeCompare(a.date))[0] : null;

      <div class="ai-panel__header">
        <span class="ai-panel__icon">📊</span>
        <span class="ai-panel__title">今日行业分析</span>
      </div>`;

      html += `<div class="ai-panel__content">${escapeHtml(latestAnalysis.content)}</div>`;
    } else {
      html += `<div class="ai-panel__content text-tertiary">今日尚未生成分析${latestAnalysis ? `（上次：${formatDate(latestAnalysis.date, 'MM-DD')}）` : ''}</div>`;
    }
    const industryLabels = {
      pet: '🔥 今日热点+热销品',
      vlog: '📊 博主分析+热门内容',
      local_deal: '🏙️ 上海消费分析'
    };

      <button class="btn btn--primary btn--sm" onclick="Media.aiAnalysis('industry')">🔄 ${latestAnalysis && latestAnalysis.date === today() ? '重新' : ''}${industryLabels[acc.type] || '生成分析'}</button>
      <button class="btn btn--ghost btn--sm" onclick="Media.aiAnalysis('shooting')">🎬 拍摄脚本</button>
    </div>
    <div id="media-ai-result"></div>
    </div>`;

    // 内容日历（周视图）
    html += this.renderWeekCalendar(acc);

    // 任务看板
    html += this.renderKanban(acc);

    // 选题库
    html += this.renderTopicPool(acc);

    // 账号专属功能
    if (acc.type === 'pet') {
      html += this.renderProductPool(acc);
    } else if (acc.type === 'local_deal') {
      html += this.renderMerchantContacts(acc);
    } else if (acc.type === 'vlog') {
      html += this.renderPublishChecklist(acc);
    }

    // 发布记录
    html += this.renderPublishRecords(acc);

  },

  renderWeekCalendar(acc) {
    const now = new Date();
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((now.getDay() || 7) - 1));

    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }

    const dayLabels = ['一', '二', '三', '四', '五', '六', '日'];
    const statusIcons = { draft: '📝', filming: '🎬', editing: '✂️', ready: '✅', published: '🚀' };

    let cells = days.map((d, i) => {
      const dateStr = formatDate(d);
      const contents = acc.contentCalendar.filter(c => c.date === dateStr);
      const hasContent = contents.length > 0;
      const isToday = dateStr === today();
      return `
        <div class="week-calendar__day ${hasContent ? 'week-calendar__day--has-task' : ''}" style="${isToday ? 'border:2px solid var(--color-primary);' : ''}">
          <div class="week-calendar__day-label">周${dayLabels[i]}</div>
          <div class="week-calendar__day-date">${d.getDate()}</div>
          <div class="week-calendar__day-icon">${contents.map(c => statusIcons[c.status] || '📌').join('')}</div>
        </div>
      `;
    }).join('');

    return `<div class="card">
      <div class="card__header">
        <span class="card__title">本周排期</span>
        <span class="text-sm text-tertiary">${formatDate(monday, 'MM-DD')} - ${formatDate(days[6], 'MM-DD')}</span>
      </div>
      <div class="week-calendar">${cells}</div>
    </div>`;
  },

  renderKanban(acc) {
    const columns = [
      { id: 'draft', title: '待拍摄', icon: '📝' },
      { id: 'filming', title: '拍摄中', icon: '🎬' },
      { id: 'editing', title: '剪辑中', icon: '✂️' },
      { id: 'ready', title: '待发布', icon: '✅' },
      { id: 'published', title: '已发布', icon: '🚀' }
    ];

    let columnsHtml = columns.map(col => {
      const items = acc.contentCalendar.filter(c => c.status === col.id);
      const cards = items.map(item => {
        const priorityClass = { high: 'kanban__card--priority-high', medium: 'kanban__card--priority-medium', low: 'kanban__card--priority-low' }[item.priority] || '';
        return `<div class="kanban__card ${priorityClass}" onclick="Media.showEditContent('${item.id}')">
          <div class="kanban__card-title">${escapeHtml(item.title)}</div>
          <div class="kanban__card-meta">${formatDate(item.date, 'MM-DD')} ${getWeekday(item.date)}</div>
        </div>`;
      }).join('');
      return `<div class="kanban__column">
        <div class="kanban__column-header">
          <span class="kanban__column-title">${col.icon} ${col.title}</span>
          <span class="kanban__column-count">${items.length}</span>
        </div>
        ${cards || '<div style="text-align:center;padding:var(--space-md);color:var(--color-text-tertiary);font-size:var(--font-xs);">空</div>'}
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="card__header"><span class="card__title">任务看板</span></div>
      <div class="kanban">${columnsHtml}</div>
    </div>`;
  },

  renderTopicPool(acc) {
    const topics = [...(acc.topicPool || [])].sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 10);
    let html = `<div class="card">
      <div class="card__header">
        <span class="card__title">选题库</span>
        <span class="card__action" onclick="Media.showAddTopic()">+ 新选题</span>
      </div>`;
    if (topics.length === 0) {
      html += UI.emptyState('💡', '还没有选题');
    } else {
      html += '<div>';
      topics.forEach(t => {
        const statusTag = { pending: 'tag', selected: 'tag tag--primary', completed: 'tag tag--success' }[t.status] || 'tag';
        const statusLabel = { pending: '待定', selected: '已选', completed: '已完成' }[t.status] || '';
        html += `
          <div class="list-item" onclick="Media.showEditTopic('${t.id}')" style="cursor:pointer;">
            <div class="list-item__icon" style="background:var(--color-warning-bg);">💡</div>
            <div class="list-item__content">
              <div class="list-item__title">${escapeHtml(t.title)}</div>
              <div class="list-item__desc">${t.category || ''} ${t.tags && t.tags.length ? '· ' + t.tags.join('/') : ''}</div>
            </div>
            <span class="tag ${statusTag}">${statusLabel}</span>
          </div>
        `;

      html += '</div>';

    html += '</div>';
    return html;

  renderPublishRecords(acc) {

      if (trendData.length > 1) {
        html += `<div style="margin-bottom:var(--space-md);">${Charts.line(trendData, { height: 120, color: '#FF6B6B', formatY: v => formatNumber(v) })}</div>`;

  showEditTopic(id) {
    const acc = StorageManager.data.media.accounts[this.currentAccount];

    this._editingTopic = id;
    const topicCategories = this.getTopicCategories(acc.type);
    UI.modal(`

        <div class="modal__title">编辑选题</div>
        <div class="modal__close" onclick="UI.closeModal()">✕</div>

      <div class="modal__body">

          <label class="form-label">标题</label>
          <input type="text" class="form-input" id="topic-title" value="${escapeHtml(t.title)}">
        </div>
        <div class="form-group">
          <label class="form-label">分类</label>
          <select class="form-input" id="topic-category">
            ${topicCategories.map(c => `<option value="${c}" ${t.category === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">状态</label>
          <select class="form-input" id="topic-status">

            <option value="completed" ${t.status === 'completed' ? 'selected' : ''}>已完成</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">优先级</label>
          <select class="form-input" id="topic-priority">
            <option value="medium" ${t.priority === 'medium' ? 'selected' : ''}>中</option>
            <option value="high" ${t.priority === 'high' ? 'selected' : ''}>高</option>
            <option value="low" ${t.priority === 'low' ? 'selected' : ''}>低</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">标签（逗号分隔）</label>
          <input type="text" class="form-input" id="topic-tags" value="${(t.tags || []).join(',')}">
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-input" id="topic-note">${escapeHtml(t.note || '')}</textarea>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--danger" onclick="Media.deleteTopic('${id}')">删除</button>
        <button class="btn btn--ghost" onclick="UI.closeModal()">取消</button>
        <button class="btn btn--primary" onclick="Media.saveTopic()">保存</button>
      </div>
    `);
  },

  getTopicCategories(type) {
    const map = {
      pet: ['吃播', '日常', '互动', '测评', '科普', '搞笑', '带货'],
      vlog: ['日常', '探店', '穿搭', '美食', '旅行', '家居', '自律'],
      local_deal: ['餐饮美食', '生活服务', '休闲娱乐', '探店', '测评', '优惠']
    };
    return map[type] || ['其他'];
  },

  saveTopic() {
    const acc = StorageManager.data.media.accounts[this.currentAccount];
    const title = $('#topic-title').value.trim();
    if (!title) { UI.toast('请输入标题'); return; }
    const category = $('#topic-category').value;
    const priority = $('#topic-priority').value;
    const tags = $('#topic-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const note = $('#topic-note').value.trim();
    const status = $('#topic-status')?.value || 'pending';

    if (this._editingTopic) {
      const t = acc.topicPool.find(x => x.id === this._editingTopic);
      if (t) { Object.assign(t, { title, category, priority, tags, note, status, updatedAt: nowISO() }); }
    } else {
      acc.topicPool.push({ id: uuid(), title, category, priority, tags, note, status: 'pending', createdAt: nowISO() });
    }
    StorageManager.save();
    UI.closeModal();
    UI.toast('已保存');
    this.render();
  },

  deleteTopic(id) {
    UI.confirm('确定删除这个选题？', '删除', () => {
      const acc = StorageManager.data.media.accounts[this.currentAccount];
      acc.topicPool = acc.topicPool.filter(t => t.id !== id);
      StorageManager.save();
      UI.closeModal();
      UI.toast('已删除');
      this.render();
    });
  },

      Router.navigate('settings');
      return;
    }
    resultDiv.innerHTML = UI.loading('AI 分析中...');
    try {
      const acc = StorageManager.data.media.accounts[this.currentAccount];
      const result = await AIAnalyzer.analyzeMedia(acc, type);
      const resultTitles = {
        pet: { industry: '🔥 热点+热销品分析', shooting: '🎬 拍摄脚本' },
        vlog: { industry: '📊 博主分析+热门内容', shooting: '🎬 拍摄脚本' },
        local_deal: { industry: '🏙️ 上海消费分析', shooting: '🎬 探店脚本' }
      };
      const title = (resultTitles[acc.type] || {})[type] || 'AI 分析';
      resultDiv.innerHTML = `<div class="ai-panel__section mt-md"><div class="ai-panel__section-title">🤖 ${title}</div><div class="ai-panel__content">${escapeHtml(result)}</div></div>`;

      // 缓存分析结果
      acc.aiAnalyses.push({
        id: uuid(), date: today(), type,
        content: result, generatedBy: 'openai', createdAt: nowISO()
      });
      // 只保留最近20条
      if (acc.aiAnalyses.length > 20) acc.aiAnalyses = acc.aiAnalyses.slice(-20);
      StorageManager.save();
    } catch (e) {
      resultDiv.innerHTML = `<div class="text-sm text-danger mt-md">分析失败：${escapeHtml(e.message)}</div>`;
    }
  }
};

const Inspiration = {
  filterAccount: 'all',
  filterTag: 'all',
  searchText: '',

  render(container) {
    const target = container || $('#media-content');
    let items = StorageManager.data.inspiration.items || [];
    const accountIds = StorageManager.data.media.accounts.map(a => a.id);
    const accountNames = StorageManager.data.media.accounts.map(a => a.name);

    // 过滤
    if (this.filterAccount !== 'all') {
      items = items.filter(i => i.relatedAccountId === this.filterAccount || (this.filterAccount === 'none' && !i.relatedAccountId));
    }
    if (this.filterTag !== 'all') {
      items = items.filter(i => (i.tags || []).includes(this.filterTag));
    }
    if (this.searchText) {
      items = items.filter(i => (i.title + i.content).toLowerCase().includes(this.searchText.toLowerCase()));
    }
    items = [...items].sort((a, b) => b.createdAt.localeCompare(a.createdAt));

    // 收集所有标签
    const allTags = [...new Set(StorageManager.data.inspiration.items.flatMap(i => i.tags || []))];

    let html = `

    const title = $('#insp-title').value.trim();
    if (!title) { UI.toast('请输入标题'); return; }
    const content = $('#insp-content').value.trim();
    const relatedAccountId = $('#insp-account').value || null;
    const tags = $('#insp-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const status = $('#insp-status')?.value || 'new';

    if (this._editingId) {
      const item = StorageManager.data.inspiration.items.find(i => i.id === this._editingId);
      if (item) {
        Object.assign(item, { title, content, relatedAccountId, tags, status, updatedAt: nowISO() });
      }
      this._editingId = null;
    } else {
      StorageManager.data.inspiration.items.push({
        id: uuid(), title, content, relatedAccountId, tags, status: 'new',
        source: '', mediaUrls: [], createdAt: nowISO(), updatedAt: nowISO()
      });
    }
    StorageManager.save();
    UI.closeModal();
    UI.toast('已保存');
    this.render();
  },

    UI.confirm('确定删除这个灵感？', '删除', () => {

    const resultDiv = $('#insp-ai-result');

    const acc = StorageManager.data.media.accounts[idx];
    resultDiv.innerHTML = UI.loading(`为「${acc.name}」生成推荐主题...`);

  }

/* ==================== AI 分析器 ==================== */
const AIAnalyzer = {
  checkApiKey() {
    return !!StorageManager.getSetting('openaiApiKey');
  },

  getTodayCallCount() {
    const log = StorageManager.data.aiCallLog;
    if (log.date !== today()) return 0;
    return log.count || 0;
  },

  incrementCallCount() {
    const log = StorageManager.data.aiCallLog;
    if (log.date !== today()) {
      log.date = today();
      log.count = 1;
    } else {
      log.count = (log.count || 0) + 1;
    }
    StorageManager.save();
  },

  async callOpenAI(systemPrompt, userPrompt, options = {}) {
    const apiKey = StorageManager.getSetting('openaiApiKey');
    if (!apiKey) throw new Error('请先配置 API Key');

    if (this.getTodayCallCount() >= 10) {
      throw new Error('今日 API 调用次数已达上限（10次）');
    }

    const model = StorageManager.getSetting('openaiModel') || 'deepseek-chat';

    const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ],
        max_tokens: options.maxTokens || 800,
        temperature: options.temperature || 0.7
      })
    });

    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.error?.message || `API 调用失败 (${response.status})`);
    }

    const data = await response.json();
    this.incrementCallCount();
    return data.choices[0].message.content;
  },

  async analyzeSaving(analysis) {

    const monthRecords = StorageManager.data.accounting.records.filter(r => {

  async analyzeDiet() {
    const data = StorageManager.data.fitness;
    const goal = data.weightGoal;
    const weights = [...data.weightRecords].sort((a, b) => a.date.localeCompare(b.date));

    if (recentWeights.length >= 2) {
      const change = latestWeight - recentWeights[0].weight;
      if (change > 0.3) weightTrend = `上升 ${change.toFixed(1)}kg`;
      else if (change < -0.3) weightTrend = `下降 ${Math.abs(change).toFixed(1)}kg`;
      else weightTrend = '基本稳定';

    const recentFoods = (data.foodRecords || []).slice(-10).map(r => `${{breakfast:'早',lunch:'午',dinner:'晚',snack:'加'}[r.meal]||''}餐: ${r.food}${r.calories ? '(' + r.calories + '大卡)' : ''}`).join('\n');

        const systemPrompt = '你是抖音本地生活团购带货赛道的专业分析师，精通上海地区消费市场。你需要分析上海地区大家对吃喝玩乐的需求趋势、常去的店、消费水平，并推荐适合拍摄的店铺。回复使用中文，用简洁要点列出。';

        const merchants = (account.merchantContacts || []).slice(0, 5).map(m => `${m.name}(${m.category},${m.status})`).join('、');
        const userPrompt = `我的账号：抖音上海本地生活团购带货号（多品类混合），${account.followers}粉丝
最近视频：
${recentVideos || '暂无'}
当前合作商家：${merchants || '暂无'}
选题库：${topics || '暂无'}

请分析：
1. 🏙️ 上海地区当前消费趋势（大家现在喜欢去什么类型的店，吃喝玩乐各品类的热门趋势）
2. 💰 各品类人均消费分析（餐饮/娱乐/生活服务，分别什么价位段最受欢迎）
3. 🏪 推荐拍摄的店铺类型和区域（给出5个值得去拍的店或店型，说明为什么值得拍、能带什么团购）
4. 📺 抖音本地生活团购近期什么内容数据好（探店形式、团购话术、拍摄风格）
5. 🎬 本周拍摄建议（2-3条，结合上海本地特色，给出具体探店选题）`;

        return await this.callOpenAI(systemPrompt, userPrompt, { maxTokens: 1000 });
      } else if (type === 'shooting') {
        const systemPrompt = '你是本地生活团购探店视频策划专家，专注上海地区。回复使用中文，给出具体拍摄脚本。';
        const userPrompt = `账号：抖音上海本地团购带货号，${account.followers}粉丝
最近视频：${recentVideos || '暂无'}
选题库：${topics || '暂无'}

请提供：
1. 本周推荐的3个探店选题（上海地区，餐饮/娱乐/服务各至少一个）
2. 每个选题的探店脚本大纲（进店hook、体验过程、团购引导、结尾互动）
3. 团购话术技巧（如何自然引导下单）
4. 拍摄和发布建议（最佳时段、话题标签、位置标签）`;

        return await this.callOpenAI(systemPrompt, userPrompt, { maxTokens: 1200 });
      }
    }
  }
};

  saveApiKey() {
    const key = $('#set-apikey').value.trim();

    StorageManager.setSetting('openaiEnabled', !!key);
    UI.closeModal();
    UI.toast(key ? 'API Key 已配置' : '已清除');
